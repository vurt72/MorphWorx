<svg xmlns="http://www.w3.org/2000/svg" width="121.92mm" height="128.5mm" viewBox="0 0 121.92 128.5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="128.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#7a7a7a"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="0" y2="13" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#555555"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
    <linearGradient id="ftr" x1="0" y1="116" x2="0" y2="128.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7a7a7a"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="121.92" height="128.5" fill="url(#bg)"/>

  <!-- Header strip -->
  <rect width="121.92" height="13" fill="url(#hdr)"/>

  <!-- Footer strip (port area) -->
  <rect y="88" width="121.92" height="40.5" fill="rgba(0,0,0,0.12)"/>

  <!-- Column dividers -->
  <line x1="30.48"  y1="13" x2="30.48"  y2="128.5" stroke="#666" stroke-width="0.4" opacity="0.7"/>
  <line x1="60.96"  y1="13" x2="60.96"  y2="128.5" stroke="#666" stroke-width="0.4" opacity="0.7"/>
  <line x1="91.44"  y1="13" x2="91.44"  y2="128.5" stroke="#666" stroke-width="0.4" opacity="0.7"/>

  <!-- Horizontal separator above port grid -->
  <line x1="0" y1="88" x2="121.92" y2="88" stroke="#555" stroke-width="0.5"/>

  <!-- Module title -->
  <text x="60.96" y="9.5" text-anchor="middle" font-family="sans-serif" font-size="5.5" fill="#ffffff" font-weight="bold" letter-spacing="1">XORnado</text>

  <!-- Channel labels -->
  <text x="15.24" y="19"  text-anchor="middle" font-family="sans-serif" font-size="3.2" fill="#dddddd">CH 1</text>
  <text x="45.72" y="19"  text-anchor="middle" font-family="sans-serif" font-size="3.2" fill="#dddddd">CH 2</text>
  <text x="76.20" y="19"  text-anchor="middle" font-family="sans-serif" font-size="3.2" fill="#dddddd">CH 3</text>
  <text x="106.68" y="19" text-anchor="middle" font-family="sans-serif" font-size="3.2" fill="#dddddd">CH 4</text>

  <!-- Knob row labels (left gutter) -->
  <text x="2" y="23"  font-family="sans-serif" font-size="2.6" fill="#cccccc">EQ</text>
  <text x="2" y="37"  font-family="sans-serif" font-size="2.6" fill="#cccccc">SPD</text>
  <text x="2" y="51"  font-family="sans-serif" font-size="2.6" fill="#cccccc">P0</text>
  <text x="2" y="65"  font-family="sans-serif" font-size="2.6" fill="#cccccc">P1</text>
  <text x="2" y="79"  font-family="sans-serif" font-size="2.6" fill="#cccccc">P2</text>
</svg>
